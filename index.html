<style id="css">:root{--bg:#040a0e;--panel:#0e161b;--item:#121c22;--line:#1c2a30;--br:#3b4b53;--tx:#e8f1f4;--mu:#5d7178;--mu2:#8a9ca2;--cy:#4db7df;--cyRGB:77,183,223;--cy2:#87b8a8;--amb:#e6c273;--ok:#4fae6e;--p1:#d97a7a;--p2:#8fd1b4;--p3:#7fb8e6;--red:#d97a7a;--yel:#ddc193;--ac2:#8fd1b4;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Instrument Serif',Georgia,serif}

<canvas id="stars"></canvas><div class="floor"></div>
<div class="wrap" id="root"></div>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div><div class="save" id="sv"></div>
<div id="gate" style="display:none"><div class="box"><img src="icon-192.png" alt=""><h1>Life <em>OS</em></h1>
<p>Melde dich mit deinem Google-Konto an. Danach holt die App alles aus deinem Kevin-Vault und hält es dort aktuell.</p>
<button id="gbtn">Mit Google verbinden</button><small id="gmsg"></small></div></div>
<script src="config.js?v=14"></script>
<script src="sync.js?v=14"></script>
<script>
(function(){
  if('serviceWorker' in navigator){var hadSW=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW&&!rl){rl=true;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(function(r){r.update&&r.update()}).catch(()=>{}));document.addEventListener('visibilitychange',function(){if(document.visibilityState=='visible')navigator.serviceWorker.getRegistration().then(function(r){r&&r.update()})})}
  function start(){if(LOS.started)return;LOS.started=true;document.getElementById('gate').style.display='none';
    var s=document.createElement('script');s.src="app.js?v=14";s.onload=function(){Promise.resolve(LOS.sync({mails:true})).catch(function(){}).finally(function(){window.migrateSkin&&migrateSkin()})};document.body.appendChild(s)}
  if(LOS.trySilent&&LOS.trySilent())return;
  if(LOS.data){start();return}
  var g=document.getElementById('gate'),m=document.getElementById('gmsg');g.style.display='flex';
  if(!LOS.cfg.clientId)m.textContent='Noch nicht eingerichtet: In config.js fehlt die Google-Client-ID.';
  /* Daten holen – auch direkt nach der Rückkehr von Google (Weiterleitungs-Login), ohne nochmal klicken zu müssen */
  async function fetchData(){m.textContent='Hole Daten aus dem Vault …';
    try{await LOS.sync();
      if(LOS.data)start();else m.textContent=({vault:'Der Kevin-Vault liegt noch nicht in „Meine Ablage“ – bitte zuerst verschieben.',err:'Im Vault fehlt noch die Datei Life OS/life-os.json – sag Claude Bescheid.'})[document.body.dataset.st]||'Im Vault liegt noch keine Life-OS-Datei – sag Claude Bescheid.'}
    catch(e){m.textContent=e.message||'Abgleich fehlgeschlagen'}}
  document.getElementById('gbtn').onclick=async function(){
    if(LOS.hasTok&&LOS.hasTok())return fetchData();
    m.textContent='Verbinde …';
    try{await LOS.login();await fetchData()}
    catch(e){m.textContent=e.message||'Anmeldung fehlgeschlagen'}};
  if(LOS.cfg.clientId&&LOS.hasTok&&LOS.hasTok())fetchData();
})();
</script>
</body></html>
